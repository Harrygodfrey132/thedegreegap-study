baseURL = "https://thedegreegap.com/study/"
languageCode = "en-gb"
title = "The Degree Gap | Tutoring & Study Resources"
disableKinds = ["taxonomy", "term"]

# Derive each page's Lastmod from its last git commit. Without this only the
# handful of pages carrying an explicit date got a <lastmod> in the sitemap.
enableGitInfo = true

[params]
  formspreeEndpoint = "https://formspree.io/f/mvgonabg"
  phone = "+447859965776"
  email = "admin@thedegreegap.com"
  mainSiteURL = "https://thedegreegap.com"
  # Google review count and rating. Single source of truth: this number appears
  # in visible copy, aria-labels and AggregateRating schema across ~17 layouts,
  # so update it here only. Must match the live Google Business Profile, since
  # schema that disagrees with what a user can see is a structured-data breach.
  googleReviewCount = 108
  googleReviewRating = "5.0"

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changeFreq = "monthly"
  priority = 0.6

[permalinks]
  personal-statement-tutor = "/personal-statement-tutor/:contentbasename/"
  personal-statements = "/personal-statements/:contentbasename/"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  # main.css lives in static/ so Decap CMS can edit it, but it is also mounted
  # into assets/ so baseof.html can minify and fingerprint it. Netlify used to
  # minify on deploy; Apache does not, so Hugo has to do it now.
  [[module.mounts]]
    source = "static/css"
    target = "assets/css"
  # Same reason as main.css above: main.js is served unfingerprinted otherwise,
  # and Cloudflare caches it for 4 hours, so a JS change does not reach visitors
  # until that expires. Mounting it here lets baseof.html fingerprint it.
  [[module.mounts]]
    source = "static/js"
    target = "assets/js"
  [[module.mounts]]
    source = "static"
    target = "static"
