baseURL = "https://thedegreegap.com/study/"
languageCode = "en-gb"
title = "The Degree Gap | Tutoring & Study Resources"
disableKinds = ["taxonomy", "term"]

# Derive each page's Lastmod from its last git commit. Without this only the
# handful of pages carrying an explicit date got a <lastmod> in the sitemap.
enableGitInfo = true

[params]
  formspreeEndpoint = "https://formspree.io/f/mvgonabg"
  phone = "+447859965776"
  email = "admin@thedegreegap.com"
  mainSiteURL = "https://thedegreegap.com"
  # Google review count and rating. Single source of truth: this number appears
  # in visible copy, aria-labels and AggregateRating schema across ~17 layouts,
  # so update it here only. Must match the live Google Business Profile, since
  # schema that disagrees with what a user can see is a structured-data breach.
  googleReviewCount = 109
  googleReviewRating = "5.0"
  # Google Ads, read by partials/ads-tracking.html on the Google Ads landing
  # pages and on /book-a-call-thank-you/, where the lead conversion fires.
  # Both stay blank until the Ads account is linked, and while they are blank
  # nothing Ads-related loads or fires. googleAdsId is the tag ID ("AW-..."),
  # googleAdsLeadLabel the label of the lead conversion action. Both are in
  # Google Ads under Goals > Conversions > (the lead action) > Tag setup.
  googleAdsId = "AW-17482445189"
  googleAdsLeadLabel = "nlkhCL-HkoYdEIXjo5BB"
  # Google Tag Manager container, loaded by partials/gtm-head.html and
  # gtm-body.html. Blank it to remove GTM from every page in one edit.
  # Note: GA4 (G-X8HZE9WB3J) and the Meta Pixel are hardcoded in baseof.html,
  # so do not also add tags for those inside this container or page views and
  # conversions get counted twice.
  googleTagManagerId = "GTM-WJCKZ85H"
  # Cookiebot consent banner, loaded by partials/cookiebot.html as the first
  # script in <head> so its auto-blocking can hold GTM, GA4 and the Meta Pixel
  # until the visitor consents. Blank it to remove consent from every page.
  cookiebotId = "aeafae27-f559-4eb3-ac77-9e43fcb68fab"

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changeFreq = "monthly"
  priority = 0.6

[permalinks]
  personal-statement-tutor = "/personal-statement-tutor/:contentbasename/"
  personal-statements = "/personal-statements/:contentbasename/"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  # main.css lives in static/ so Decap CMS can edit it, but it is also mounted
  # into assets/ so baseof.html can minify and fingerprint it. Netlify used to
  # minify on deploy; Apache does not, so Hugo has to do it now.
  [[module.mounts]]
    source = "static/css"
    target = "assets/css"
  # Same reason as main.css above: main.js is served unfingerprinted otherwise,
  # and Cloudflare caches it for 4 hours, so a JS change does not reach visitors
  # until that expires. Mounting it here lets baseof.html fingerprint it.
  [[module.mounts]]
    source = "static/js"
    target = "assets/js"
  [[module.mounts]]
    source = "static"
    target = "static"
