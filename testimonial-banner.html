<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Testimonial Banner — The Degree Gap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #2a2f3e;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 0;
    }

    /* 1080 x 1080 square canvas */
    .banner {
      width: 1080px;
      height: 1080px;
      background: #1A1F2E;
      position: relative;
      box-sizing: border-box;
      padding: 80px;
      color: #FBF7EF;
      overflow: hidden;
    }

    /* Opening quote mark top-left */
    .quote-open {
      position: absolute;
      top: 76px;
      left: 82px;
      display: flex;
      gap: 12px;
    }
    .quote-open span {
      display: block;
      width: 16px;
      height: 66px;
      background: #800020;
      border-radius: 4px;
      transform: skewX(-14deg);
    }

    /* Closing quote mark bottom-right */
    .quote-close {
      position: absolute;
      bottom: 96px;
      right: 82px;
      display: flex;
      gap: 12px;
    }
    .quote-close span {
      display: block;
      width: 16px;
      height: 66px;
      background: #800020;
      border-radius: 4px;
      transform: skewX(-14deg);
    }

    /* Brand wordmark */
    .wordmark {
      text-align: center;
      font-weight: 800;
      font-size: 62px;
      letter-spacing: -0.02em;
      color: #FBF7EF;
      margin-top: 26px;
      margin-bottom: 96px;
    }

    /* Testimonial quote */
    .quote-body {
      font-weight: 800;
      font-size: 108px;
      line-height: 1.06;
      letter-spacing: -0.028em;
      color: #FBF7EF;
      padding: 0 18px;
    }

    /* Squiggle underline wrapper */
    .underline-wrap {
      position: relative;
      display: inline-block;
      white-space: nowrap;
    }
    .underline-wrap svg {
      position: absolute;
      left: -10px;
      bottom: -34px;
      width: calc(100% + 20px);
      height: 32px;
      display: block;
    }

    /* Bottom row */
    .bottom-row {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .attribution {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #800020;
      color: #FBF7EF;
      font-weight: 800;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.02em;
    }
    .name-role .name {
      font-weight: 700;
      font-size: 30px;
      color: #FBF7EF;
      line-height: 1.2;
    }
    .name-role .role {
      font-weight: 500;
      font-size: 22px;
      color: #9CA3AF;
      line-height: 1.3;
      margin-top: 2px;
    }

    .stars {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-right: 110px;
    }
    .stars svg { display: block; }

    /* Screenshot hint (only appears on the surrounding page, not in the banner) */
    .hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      text-align: center;
      color: #FBF7EF;
      opacity: 0.55;
      font-size: 13px;
      font-family: 'Manrope', sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="banner">

    <!-- Opening quote -->
    <div class="quote-open" aria-hidden="true">
      <span></span><span></span>
    </div>

    <!-- Wordmark -->
    <div class="wordmark">The Degree Gap</div>

    <!-- Quote body -->
    <div class="quote-body">
      My son's grade<br />
      went from a<br />
      <span class="underline-wrap">4 to a 7<svg viewBox="0 0 600 32" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 8 22 Q 60 4, 120 20 T 240 20 T 360 20 T 480 20 T 592 20" stroke="#800020" stroke-width="8" fill="none" stroke-linecap="round" />
      </svg></span> in Maths<br />
      in a single term.
    </div>

    <!-- Bottom row: attribution + stars + closing quote -->
    <div class="bottom-row">

      <div class="attribution">
        <div class="avatar">S</div>
        <div class="name-role">
          <div class="name">Sarah K.</div>
          <div class="role">Parent of GCSE Student</div>
        </div>
      </div>

      <div class="stars" aria-label="5 star review">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="#F4C430" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="#F4C430" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="#F4C430" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="#F4C430" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="#F4C430" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>

    </div>

    <!-- Closing quote -->
    <div class="quote-close" aria-hidden="true">
      <span></span><span></span>
    </div>

  </div>

  <p class="hint">To export: Cmd+Shift+4 on Mac, drag over the 1080&times;1080 canvas.</p>

</body>
</html>
