  text: My son gained almost two grades higher than his year 13 mock paper. His tutor Jacob was excellent.
- name: Philippa
  role: Parent of GCSE Student
  text: I was really pleased to discover The Degree Gap when my daughter needed help getting the grades she needed for GCSEs. The team offer a really personalised service and I felt really well looked after and supported from the start. There are lots of tutors to choose from and great flexibility on timings. Highly recommend.
