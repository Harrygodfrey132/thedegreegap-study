- name: Omo
  role: Parent of GCSE Student
  text: My son, who is in Year 10, really struggled with English and was completely disengaged from the subject. After six months of tutoring, he has improved from a grade 5 to a 6/7. He now looks forward to his lessons. Through one-to-one tutoring he has learned effective strategies that help him approach English in a way that resonates with him.
- name: Sarah K.
  role: Parent of GCSE Student
  text: My son's grade went from a 4 to a 7 in Maths in a single term. The tutor found exactly where things had stopped clicking — years earlier than we thought — and worked through it methodically. The biggest change wasn't even the grade. It was how calm he was walking into the exam.
- name: Ellen
  role: Parent of GCSE Student
  text: My daughter was struggling with confidence in Maths GCSE and we decided to get a tutor. We were given a selection of tutors to choose from and told that if it did not feel like a good match we could try others. Our tutor was a complete star, listened, made it simple, set good homework and gave my daughter her confidence back. Highly recommend.
- name: Daljit
  role: Parent of A-Level Student
  text: My son gained almost two grades higher than his Year 13 mock paper. His tutor was excellent — patient, knowledgeable, and genuinely invested in his progress.
- name: Philippa
  role: Parent of GCSE Student
  text: I was really pleased to discover The Degree Gap when my daughter needed help getting the grades she needed for GCSEs. The team offer a really personalised service and I felt really well looked after from the start. Lots of tutors to choose from and great flexibility on timings. Highly recommend.
- name: Alison
  role: Parent of A-Level Student
  text: My son has been receiving tutor lessons in A-Level History and A-Level Sociology since the beginning of this year. The tutor has been such a tremendous support, teaching him content as well as exam technique. Harry has been outstanding from day one — responses immediate and highly supportive.
