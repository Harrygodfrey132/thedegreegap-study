  # ===========================================================================
  # 5. BLOG — posts
  # ===========================================================================
  - name: "blog_posts"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Articles under /blog/. Each has a title, date, author, hero image, and markdown body."
    folder: "content/blog"
    filter: { field: "date" }
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    slug: "{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "SEO description", widget: "text" }
      - { name: "date", label: "Publish date", widget: "datetime" }
      - { name: "author", label: "Author", widget: "string", default: "Harry Godfrey" }
      - { name: "author_role", label: "Author role", widget: "string", default: "Co-founder, The Degree Gap" }
      - { name: "category", label: "Category", widget: "select", options: ["Parent Advice", "GCSE", "A-Level", "UCAS", "Behind the Scenes"] }
      - { name: "excerpt", label: "Excerpt", widget: "text", hint: "1-2 sentences shown in blog grid and previews" }
