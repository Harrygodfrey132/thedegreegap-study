      - { name: "hero_heading_line2", label: "Hero heading — line 2 (deprecated, leave empty)", widget: "string", required: false, default: "" }
      - { name: "hero_lead", label: "Hero lead paragraph", widget: "text" }
      - { name: "grade_from", label: "Grade card — from", widget: "string", hint: "e.g. 5 (must reflect a real testimonial)" }
      - { name: "grade_to", label: "Grade card — to", widget: "string", hint: "e.g. 7" }
      - { name: "grade_stat", label: "Grade card — caption", widget: "text" }
      - { name: "first_lesson_eyebrow", label: "First-lesson eyebrow", widget: "string" }
      - { name: "first_lesson_heading", label: "First-lesson heading", widget: "string" }
      - { name: "first_lesson_context", label: "First-lesson context paragraph", widget: "text" }
      - { name: "first_lesson_quote", label: "First-lesson pull quote", widget: "text", hint: "Verbatim from a real Google review. Do not edit." }
      - { name: "first_lesson_quote_name", label: "First-lesson quote — name", widget: "string" }
      - { name: "first_lesson_quote_role", label: "First-lesson quote — role", widget: "string" }
      - { name: "first_lesson_quote_grade", label: "First-lesson quote — grade caption", widget: "string" }
      - { name: "tutor_strip_heading", label: "Tutor strip heading", widget: "string" }
      - { name: "tutor_strip_body", label: "Tutor strip body", widget: "text" }
      - { name: "tutors_browse_url", label: "Tutors browse URL", widget: "string", required: false, default: "/book-a-call/" }
      - { name: "pathways_heading", label: "Pathways heading", widget: "string" }
      - { name: "pathways_lead", label: "Pathways lead", widget: "text" }
      - name: "pathways"
