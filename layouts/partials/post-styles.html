{{/* The article styles for a blog post (layouts/blog/single.html), shared
     with the GCSE options guide's subject pages, which read as articles
     too. */}}
<style>
  .post-page {
    font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #171717;
  }

  /* Sticky reading-progress bar (top of viewport, fills as user scrolls) */
  .post-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0%;
    background: #800020;
    z-index: 50;
    transition: width 0.08s ease-out;
    pointer-events: none;
  }

  .post-back {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 0;
  }
  .post-back__link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    color: #800020;
    text-decoration: none;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .post-back__link:hover { color: #5A001F; }

  .post-header {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 0;
    text-align: center;
  }
  .post-header__category {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #800020;
    margin: 0 0 18px;
  }
  .post-header__title {
    font-size: clamp(2rem, 4.5vw, 3rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: #171717;
    margin: 0 0 22px;
  }
  .post-header__lead {
    font-size: 1.15rem;
    line-height: 1.55;
    color: #5f5a54;
    margin: 0 0 28px;
  }
  .post-header__byline {
    font-size: 0.9rem;
    color: #6b6660;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
  }
  .post-header__byline strong { color: #171717; font-weight: 700; }
  .post-header__byline-sep {
    color: #c5bcaf;
    margin: 0 8px;
  }
  .post-header__reading-time {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #800020;
    font-weight: 700;
  }
  .post-header__reading-time svg {
    flex: 0 0 auto;
  }

  .post-hero {
    max-width: 1080px;
    margin: 48px auto 0;
    padding: 0 24px;
  }
  .post-hero img {
    width: 100%;
    aspect-ratio: 16 / 8;
    object-fit: cover;
    border-radius: 14px;
    display: block;
  }

  .post-body {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 32px;
    font-size: 1.0625rem;
    line-height: 1.75;
    color: #2d2a26;
  }
  /* Lead paragraph: the first paragraph in the body is bigger and lighter
     to draw the reader in (editorial convention from longform mags). */
  .post-body > p:first-of-type {
    font-size: 1.22rem;
    line-height: 1.6;
    color: #3a3530;
    margin: 0 0 32px;
    font-weight: 400;
  }
  .post-body h2 {
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.018em;
    color: #171717;
    margin: 56px 0 20px;
    line-height: 1.18;
    padding-top: 24px;
    border-top: 1px solid #ece4d4;
  }
  /* First H2 doesn't need the top divider (the lead paragraph above
     already serves as visual separation). */
  .post-body > h2:first-of-type {
    border-top: none;
    padding-top: 0;
    margin-top: 48px;
  }
  .post-body h3 {
    font-size: 1.25rem;
    font-weight: 800;
    color: #171717;
    margin: 36px 0 14px;
    line-height: 1.25;
  }
  .post-body p { margin: 0 0 22px; }
  .post-body a {
    color: #800020;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  .post-body a:hover { color: #5A001F; }

  /* Byline author link (partials/author-name.html). */
  .post-author-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: inherit;
  }
  .post-author-link:hover { text-decoration: none; }
  .post-author-link:hover strong { color: #800020; text-decoration: underline; text-underline-offset: 3px; }
  .post-author-link__photo {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 2px #fff, 0 0 0 3px #e6ded4;
  }

  /* About the author (partials/author-card.html), at the foot of the body.
     The .post-body selectors are repeated so the article's own p and a
     rules don't reach in. */
  .post-body .post-author {
    display: grid;
    grid-template-columns: 96px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
    margin: 48px 0 0;
    padding: 28px;
    border-radius: 18px;
    background: #fbf7ef;
    border: 1px solid #ece4d4;
  }
  .post-body .post-author__photo { display: block; }
  .post-body .post-author__photo img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 3px #fff, 0 6px 16px rgba(35, 23, 17, 0.12);
  }
  .post-body .post-author p { margin: 0; }
  .post-body .post-author__eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #800020;
  }
  .post-body .post-author__name {
    margin-top: 4px;
    font-size: 1.3rem;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.01em;
  }
  .post-body .post-author__name a { color: #171717; text-decoration: none; }
  .post-body .post-author__name a:hover { color: #800020; text-decoration: underline; }
  .post-body .post-author__role { font-size: 0.92rem; font-weight: 600; color: #6b6660; }
  .post-body .post-author .post-author__bio { margin-top: 12px; font-size: 1rem; line-height: 1.65; color: #3a3530; }
  .post-body .post-author__more {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: none;
  }
  .post-body .post-author__more:hover { text-decoration: underline; }
  @media (max-width: 560px) {
    .post-body .post-author { grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding: 20px; }
    .post-body .post-author__photo img { width: 64px; height: 64px; }
  }
  .post-body strong { color: #171717; font-weight: 700; }
  .post-body ul, .post-body ol { margin: 0 0 22px; padding-left: 24px; }
  .post-body li { margin-bottom: 8px; }
  .post-body hr {
    border: 0;
    border-top: 1px solid #e6ded4;
    margin: 48px 0;
  }
  .post-body blockquote {
    margin: 28px 0;
    padding: 4px 0 4px 22px;
    border-left: 3px solid #800020;
    color: #3a3530;
    font-style: italic;
  }

  /* Tables */
  .post-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 32px 0;
    font-size: 0.95rem;
    line-height: 1.5;
    border: 1px solid #e6ded4;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(35, 23, 17, 0.04);
  }
  .post-body thead {
    background: #fbf7ef;
  }
  .post-body thead th {
    text-align: left;
    font-weight: 800;
    color: #171717;
    padding: 14px 18px;
    border-bottom: 2px solid #800020;
    letter-spacing: -0.005em;
    vertical-align: bottom;
  }
  .post-body tbody td {
    padding: 16px 18px;
    border-bottom: 1px solid #ece4d4;
    vertical-align: top;
    color: #2d2a26;
  }
  .post-body tbody tr:last-child td {
    border-bottom: none;
  }
  .post-body tbody tr:nth-child(even) {
    background: #fdfaf3;
  }
  .post-body tbody td:first-child {
    font-weight: 700;
    color: #171717;
  }
  /* Mobile: horizontal scroll, otherwise tables get cramped */
  @media (max-width: 720px) {
    .post-body table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
      font-size: 0.9rem;
    }
    .post-body tbody td,
    .post-body thead th {
      white-space: normal;
      min-width: 140px;
    }
  }

  .post-tags {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 24px 56px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .post-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #800020;
    background: #fbf7ef;
    border: 1px solid #e6ded4;
    border-radius: 999px;
    padding: 5px 12px;
    text-transform: uppercase;
  }

  /* Related-on-the-site block (drives internal-link juice out of the post) */
  .post-related {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 24px 8px;
  }
  .post-related__inner { }
  .post-related__eyebrow {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: #800020;
    margin: 0 0 10px;
  }
  .post-related__heading {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.015em;
    color: #171717;
    margin: 0 0 22px;
    line-height: 1.2;
  }
  .post-related__list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid #ece4d4;
  }
  .post-related__item {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 0;
    border-bottom: 1px solid #ece4d4;
    text-decoration: none;
    color: inherit;
  }
  .post-related__item-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .post-related__item-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #171717;
    letter-spacing: -0.005em;
  }
  .post-related__item-sub {
    font-size: 0.9rem;
    color: #6b6660;
    line-height: 1.45;
  }
  .post-related__item-arrow {
    color: #800020;
    flex: 0 0 auto;
  }

  .post-cta {
    background: #fbf7ef;
    border-top: 1px solid #ece4d4;
    border-bottom: 1px solid #ece4d4;
    padding: 64px 24px;
    margin-top: 32px;
  }
  .post-cta__inner {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
  }
  .post-cta__title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.015em;
    color: #171717;
    margin: 0 0 14px;
  }
  .post-cta__sub {
    font-size: 1rem;
    line-height: 1.55;
    color: #5f5a54;
    margin: 0 0 24px;
  }
  .post-cta__btn {
    display: inline-block;
    background: #800020;
    color: #fbf7ef;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 14px 28px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 6px 16px rgba(128, 0, 32, 0.22);
    transition: background 0.18s ease, transform 0.18s ease;
  }
  .post-cta__btn:hover {
    background: #5A001F;
    transform: translateY(-1px);
  }

  /* More-posts strip */
  .more-posts {
    max-width: 1200px;
    margin: 0 auto;
    padding: 72px 24px 96px;
  }
  .more-posts__heading {
    font-size: 1.4rem;
    font-weight: 800;
    color: #171717;
    margin: 0 0 32px;
    letter-spacing: -0.015em;
  }
  .more-posts__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px 28px;
  }
  @media (max-width: 980px) {
    .more-posts__grid { grid-template-columns: repeat(2, 1fr); gap: 36px 24px; }
  }
  @media (max-width: 640px) {
    .more-posts__grid { grid-template-columns: 1fr; gap: 36px; }
  }
  .more-posts__card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .more-posts__card-media {
    width: 100%;
    aspect-ratio: 16 / 11;
    overflow: hidden;
    border-radius: 12px;
    background: #f3ecdf;
    margin: 0 0 18px;
  }
  .more-posts__card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }
  .more-posts__card:hover .more-posts__card-media img {
    transform: scale(1.04);
  }
  .more-posts__card-meta {
    font-size: 0.8rem;
    font-weight: 600;
    color: #6b6660;
    margin: 0 0 8px;
  }
  .more-posts__card-title {
    font-size: 1.15rem;
    font-weight: 800;
    line-height: 1.25;
    color: #171717;
    margin: 0;
    transition: color 0.18s ease;
  }
  .more-posts__card:hover .more-posts__card-title {
    color: #800020;
  }
</style>
